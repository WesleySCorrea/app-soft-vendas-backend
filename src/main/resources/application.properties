spring.application.name=app-soft-vendas-backend
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:8745/vendas
spring.datasource.username=vendas
spring.datasource.password=vendas

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=vendas
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/app-soft

